default:
  cache:
    key: terraform-cache
    paths:
      - .terraform/
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  tags:
    - docker

stages:
  - init
  - validate
  - plan
  - apply

variables:
  TF_IN_AUTOMATION: "true"
  TF_LOG: "DEBUG"
  TF_VAR_FILE: "terraform.tfvars"

before_script:
  - chmod +x scripts/download-tfvars.sh
  - ./scripts/download-tfvars.sh

init:
  stage: init
  script:
    - terraform --version
    - |
      if [[ "$CI_COMMIT_BRANCH" == "dev" || "$CI_COMMIT_BRANCH" == "stage" || "$CI_COMMIT_BRANCH" == "prod" ]]; then
        terraform init -backend-config=backend-${CI_COMMIT_BRANCH}.hcl
      else
        terraform init -backend=false
      fi
    - ls -la
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: always

validate:
  stage: validate
  dependencies:
    - init
  script:
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: always

plan:
  stage: plan
  dependencies:
    - init
  script:
    - terraform init -backend=false
    - terraform plan -var-file=${TF_VAR_FILE} -out=tfplan
    - terraform show -no-color tfplan
  artifacts:
    paths:
      - tfplan
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: always